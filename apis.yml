name: Homigo
description: Homigo was a Toronto-based home-services startup, founded in 2016, that
  later rebranded to Setter and operated a concierge platform giving each homeowner
  a dedicated concierge to manage home maintenance and repairs — plumbing, HVAC, electrical,
  landscaping, roofing, pools, masonry, appliances, and handyman work — at the touch
  of a button. Backed by 500 Global, the company was acquired by Thumbtack in December
  2020. Its website (setter.com) no longer resolves, and no public API, developer
  portal, SDKs, or documentation were ever published, so there is no live provider
  surface to enrich.
